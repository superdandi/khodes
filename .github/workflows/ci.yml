name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Build, test and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libasound2-dev libx11-dev libxkbcommon-dev \
            libfontconfig1-dev libfreetype6-dev libudev-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install cargo-truce
        run: cargo install cargo-truce --version 6.3.0 --locked

      - name: Doctor
        run: cargo truce doctor

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Realtime allocation guard
        run: cargo test --locked --workspace --features rt-paranoid

      - name: DSP boundary
        run: sh tools/check-dsp-boundary.sh

      - name: Build CLAP and VST3
        run: cargo truce build --clap --vst3

      - name: CLAP smoke test
        run: sh tools/clap-smoke.sh target/bundles/Khodes.clap

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: khodes-bundles
          path: |
            target/bundles/*.clap
            target/bundles/*.vst3
          if-no-files-found: error
          retention-days: 7
