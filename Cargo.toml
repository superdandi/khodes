# Espacio de trabajo y crate raíz de Khodes.

[package]
name = "khodes"
version = "0.1.0-preview.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Piano eléctrico de tine sintetizado, derivado de la voz Rhodes de Keys"

[workspace]
members = [".", "dsp", "kit"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"
repository = "https://github.com/khodes/khodes"

[workspace.dependencies]
khodes-dsp = { path = "dsp" }
khodes-kit = { path = "kit" }

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
doctest = false

[[bin]]
name = "khodes-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["clap", "vst3", "standalone"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
standalone = ["dep:truce-standalone"]
# Detecta asignaciones en el hilo de audio. Solo desarrollo y CI.
rt-paranoid = ["truce/rt-paranoid"]

[dependencies]
khodes-dsp = { workspace = true }
khodes-kit = { workspace = true }
truce = { version = "6.3" }
truce-slint = { version = "6.3" }
slint = { version = "=1.15.1", default-features = false, features = [
    "compat-1-2",
    "renderer-software",
    "std",
] }
truce-clap = { version = "6.3", optional = true }
truce-vst3 = { version = "6.3", optional = true }
truce-standalone = { version = "6.3", features = ["gui"], optional = true }
clap-sys = { version = "0.5", optional = true }

[build-dependencies]
truce-slint-build = { version = "6.3" }

[dev-dependencies]
# Guardar los baselines RGBA del editor como PNG (docs/UI_SPEC.md §10).
image = "0.25"

[profile.release]
lto = "thin"
codegen-units = 1
